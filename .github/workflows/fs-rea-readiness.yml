name: FS REA - Manual Readiness

# Runs only when the owner chooses Run workflow.
# No other repositories, Codex, secrets, or project files are accessed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-rea-check:
    name: Verify REA CLI on a temporary runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install compatible Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Install pinned REA release
        run: npm install --global rea-agents@6.7.0

      - name: Verify REA CLI
        run: rea --help

      - name: Run isolated static JavaScript analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-fixture"
          printf 'export function add(a, b) { return a + b; }\n' > "$RUNNER_TEMP/rea-fixture/app.js"
          rea analyze-javascript-application "$RUNNER_TEMP/rea-fixture" --json > "$RUNNER_TEMP/rea-self-test.json"
          node -e 'const fs = require("node:fs"); const p = process.env.RUNNER_TEMP + "/rea-self-test.json"; const x = JSON.parse(fs.readFileSync(p, "utf8")); if (!x || typeof x !== "object") process.exit(1); console.log("REA produced a valid JSON result");'

      - name: Upload bounded self-test report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rea-isolated-readiness
          path: ${{ runner.temp }}/rea-self-test.json
          retention-days: 7
